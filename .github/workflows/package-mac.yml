name: macOS installer
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the existing draft release after validation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-installer
  cancel-in-progress: false
jobs:
  apple-silicon:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:mac
      - run: node --test --test-concurrency=2 test/*.test.mjs
      - uses: actions/cache@v4
        with:
          path: build/vendor
          key: macos-node-${{ hashFiles('packaging/node-runtime.json') }}
      - run: npm run package:mac -- --release --use-built-panel
      - name: Validate installation without developer tools
        run: |
          CONTEXT_CONTROL_TEST_INSTALLER_APP="$PWD/build/distribution/Install Context Manager.app" npm run test:distribution
          hdiutil verify build/distribution/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: context-manager-apple-silicon-preview
          path: |
            build/distribution/*.dmg
            build/distribution/*.sha256
            build/distribution/update.json
            build/distribution/package-info.json
            build/distribution/README-FIRST.txt
          retention-days: 30

  publish:
    if: ${{ inputs.publish_release }}
    needs: apple-silicon
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: context-manager-apple-silicon-preview
          path: release
      - name: Publish validated installer to its draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./release/package-info.json').version")
          tag="v${version}-preview.1"
          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = true
          gh release edit "$tag" --target "$GITHUB_SHA"
          gh release upload "$tag" release/*.dmg release/*.sha256 release/package-info.json release/README-FIRST.txt release/update.json --clobber
          gh release edit "$tag" --draft=false --latest
