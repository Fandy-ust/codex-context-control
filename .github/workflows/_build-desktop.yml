name: Validate and build both desktops
on:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run test:ci
      - run: npm run build:win
      - run: npm run package:win:update
      - name: Test packaged UI in both languages
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = "build/Context-Manager-$version-windows-x64/payload/ContextManager.exe"
          node scripts/dev-win.mjs --packaged $exe --demo --smoke-test --smoke-language en --shortcut-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/dev-win.mjs --packaged $exe --demo --smoke-test --smoke-language zh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run test:win:package
      - run: npm run test:win:setup
      - run: npm run test:win:update
      - uses: actions/upload-artifact@v4
        with:
          name: context-manager-windows-x64
          retention-days: 7
          path: |
            build/Context-Manager-*-windows-x64-Setup.exe
            build/Context-Manager-*-windows-x64.zip
            build/Context-Manager-*-windows-x64.zip.sha256
          if-no-files-found: error
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:architecture
      - run: npm run build:mac
      - run: npm run test:ci
      - uses: actions/cache@v4
        with:
          path: build/vendor
          key: macos-node-${{ hashFiles('packaging/node-runtime.json') }}
      - run: npm run package:mac -- --release --use-built-panel
      - name: Validate installation and image
        run: |
          CONTEXT_CONTROL_TEST_INSTALLER_APP="$PWD/build/distribution/Install Context Manager.app" npm run test:distribution
          hdiutil verify build/distribution/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: context-manager-macos-arm64
          retention-days: 7
          path: |
            build/distribution/*.dmg
            build/distribution/*.sha256
            build/distribution/package-info.json
            build/distribution/README-FIRST.txt
          if-no-files-found: error
